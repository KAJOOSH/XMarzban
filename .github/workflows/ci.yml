name: Build, test and publish

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xmarzban-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_IMAGE: kajoosh/xmarzban

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read application version and compare with pre-push commit
        id: version
        run: python3 scripts/ci_version.py

  build-test:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build application and dashboard
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: xmarzban-ci:${{ matrix.arch }}
          cache-from: type=gha,scope=xmarzban-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=xmarzban-${{ matrix.arch }}
      - name: Test application version gate
        run: python3 -m unittest scripts.test_ci_version -v
      - name: Enable TUN for isolated connection tests
        run: |
          sudo modprobe tun
          test -c /dev/net/tun
      - name: Test protocol and transport TCP/UDP connections
        run: |
          docker run --rm --cap-add NET_ADMIN --device /dev/net/tun \
            xmarzban-ci:${{ matrix.arch }} python -m scripts.test_xray_26327
      - name: Start isolated HTTPS API fixture
        run: |
          docker run -d --name xmarzban-api-ci --cap-add NET_ADMIN --device /dev/net/tun \
            --tmpfs /var/lib/marzban:rw \
            -e SQLALCHEMY_DATABASE_URL=sqlite:////var/lib/marzban/db.sqlite3 \
            -e XRAY_JSON=/var/lib/marzban/xray_config.json \
            -e XRAY_EXECUTABLE_PATH=/usr/local/bin/xray \
            -e XRAY_ASSETS_PATH=/usr/local/share/xray \
            -e UVICORN_HOST=0.0.0.0 -e UVICORN_PORT=8000 \
            -e UVICORN_SSL_CERTFILE=/var/lib/marzban/certs/localhost.crt \
            -e UVICORN_SSL_KEYFILE=/var/lib/marzban/certs/localhost.key \
            -e UVICORN_SSL_CA_TYPE=private \
            -e USE_CUSTOM_JSON_DEFAULT=true -e USE_CUSTOM_JSON_FOR_V2RAYN=true \
            -e XRAY_SUBSCRIPTION_URL_PREFIX=https://localhost:8000 \
            xmarzban-ci:${{ matrix.arch }} bash -c \
            'python scripts/init_xray_defaults.py && alembic upgrade head && exec python main.py'
          for attempt in $(seq 1 60); do
            echo "Waiting for isolated API (attempt $attempt/60)"
            if docker exec xmarzban-api-ci python -c "import ssl,urllib.request; urllib.request.urlopen('https://localhost:8000/',context=ssl.create_default_context(cafile='/var/lib/marzban/certs/localhost.crt'),timeout=2)"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Test API, subscription formats and user lifecycle
        run: docker exec xmarzban-api-ci python scripts/test_local_api.py
      - name: Create full subscription fixture
        run: |
          docker exec xmarzban-api-ci python scripts/ci_profile_user.py
          docker exec xmarzban-api-ci python -m scripts.setup_extended_xray ci_profiles
      - name: Test exact transfer of advanced client settings
        run: docker exec xmarzban-api-ci python -m scripts.test_client_profiles ci_profiles
      - name: API logs on failure
        if: failure()
        run: docker logs xmarzban-api-ci || true
      - name: Remove isolated API fixture
        if: always()
        run: docker rm -f xmarzban-api-ci || true

  publish:
    needs: [version, build-test]
    if: >-
      needs.version.outputs.changed == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Check Docker Hub credentials
        id: hub
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$HUB_TOKEN" || { echo 'Missing DOCKERHUB_TOKEN secret'; exit 1; }
          echo "username=${DOCKER_IMAGE%%/*}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          username: ${{ steps.hub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Skip an already published version
        id: registry
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          if docker buildx imagetools inspect "$DOCKER_IMAGE:$VERSION" > /tmp/manifest.txt 2>/tmp/manifest-error.txt; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already exists; publication skipped." >> "$GITHUB_STEP_SUMMARY"
          elif grep -Eq 'manifest unknown|no such manifest|: not found$' /tmp/manifest-error.txt; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            cat /tmp/manifest-error.txt >&2
            exit 1
          fi
      - name: Publish version tag to Docker Hub
        if: steps.registry.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=xmarzban-amd64
            type=gha,scope=xmarzban-arm64
